<!-- profile.component.html -->
<div class="container bg-white mt-4">
    <h2>Perfil de Usuario</h2>
    <div class="row mt-4">
      <div class="col-md-4 text-center">
        <img [src]="user.profilePicture" class="img-fluid rounded-circle" style="width: 150px; height: 150px;" alt="Profile Picture">
        <h3 class="mt-2">{{ user.name }}</h3>
        <p class="text-muted">{{ user.email }}</p>
      </div>
      <div class="col-md-8">
        <form (ngSubmit)="updateProfile()" #profileForm="ngForm">
          <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" id="name" class="form-control" [(ngModel)]="user.name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="bio" class="form-label">Biografía</label>
            <textarea id="bio" class="form-control" [(ngModel)]="user.bio" name="bio" rows="3"></textarea>
          </div>
        </form>
      </div>
    </div>
  </div>
